name: "GitHub Failure Notifier"
description: "Notifies Teams and/or email when a GitHub job fails."
inputs:
  teams-webhook:
    description: "Microsoft Teams webhook URL"
    required: false
  notify-email:
    description: "Send an email notification"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Get Commit Author Email
      shell: bash
      id: get-email
      run: |
        COMMIT_EMAIL="${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        ALT_EMAIL="${{ github.actor }}@users.noreply.github.com"
        echo "commit-email=$COMMIT_EMAIL" >> $GITHUB_ENV
        echo "alt-email=$ALT_EMAIL" >> $GITHUB_ENV
      

    - name: Send Teams Notification
      run: |
        JSON_PAYLOAD=$(jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg job "$JOB" --arg actor "$ACTOR" '
        {
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "themeColor": "ff0000",
          "summary": "GitHub Job Failed",
          "sections": [
            {
              "activityTitle": "**🚨 GITHUB JOB FAILED 🚨**",
              "facts": [
                { "name": "Repo", "value": $repo },
                { "name": "Branch", "value": $branch },
                { "name": "Failed Job", "value": $job },
                { "name": "Triggered by", "value": $actor }
              ],
              "markdown": true
            }
          ]
        }')

        echo "Generated JSON:"
        echo "$JSON_PAYLOAD"

        curl -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "YOUR_TEAMS_WEBHOOK_URL"
      env:
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        JOB: ${{ github.job }}
        ACTOR: ${{ github.actor }}

    - name: Debug JSON Payload
      shell: bash
      run: echo "$JSON_PAYLOAD"

    # - name: Install mailutils
