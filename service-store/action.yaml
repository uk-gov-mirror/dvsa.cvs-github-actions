name: Store CVS Service
description: Store CVS Lambda Service Artefacts in S3

inputs:
  gh_artifact_name:
    description: GitHub Artifact Name
    required: true
  service_name:
    description: The service name
    required: true
  environment_name:
    description: The environment name
    required: true
  access_token:
    description: GitHub Access Token
    required: true
  s3_bucket:
    description: S3 Bucket for Service Artefacts
    required: true

runs:
  using: composite
  steps:
    - name: Convert Artefact for Lambda Use
      shell: bash
      run: |
        echo -n ${{ github.sha }} > hash.txt
        cp ${{ inputs.gh_artifact_name }}.zip ${{ inputs.service_name }}-${{ github.sha }}.zip
        LAMBDA_SHA=$(openssl dgst -sha256 -binary ${{ inputs.service_name }}-${{ github.sha }}.zip | openssl enc -base64)
        echo "LAMBDA_SHA=$LAMBDA_SHA" >> $GITHUB_ENV
        aws s3 cp hash.txt "s3://${{ inputs.s3_bucket }}/${{inputs.service_name }}"/latestHash_${{ inputs.environment_name }}.txt --metadata "sha256sum=${{ env.LAMBDA_SHA }}"

    - name: Upload to S3
      shell: bash
      run: aws s3 cp ${{ inputs.service_name }}-${{ github.sha }}.zip "s3://${{ inputs.s3_bucket }}/${{inputs.service_name }}"/${{ github.sha }}.zip --metadata "sha256sum=${{ env.LAMBDA_SHA }},Tag=${{ inputs.service_name }},commit=${{ github.sha }}"