name: Manage GitHub Branches
description: Create or Delete GitHub Branches

inputs:
  action: 
    description: Delete or Create Action
    required: true
  repositories: 
    description: JSON List of repositories to perform action upon
    required: true
  branch-name:
    description: Name of the Branch to perform actions upon
    required: true
  branch-source: 
    description: Source Branch for creation
    default: develop
  dry-run:
    description: Don't perform action, just output information
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Setup Summary Table
        echo "# Branch ${{ inputs.action }} summary ${{ inputs.dry-run == 'true' && '(Dry Run)' || '' }}" >> $GITHUB_STEP_SUMMARY
        echo "| Repository | Branch | Status |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        gh auth setup-git

        # Function to Manage Branch
        manage_branch() {
          local repository=$1
          # Check if the branch exists in the repository
          branch_exists=$(git ls-remote --heads https://github.com/dvsa/$repository ${{ inputs.branch-name }} | wc -l)

          if [[ $branch_exists -gt 0 && "${{ inputs.action }}" == "Delete" ]]; then
            # Perform Delete action (Dry-run or real)
            ${{ inputs.dry-run == 'true' && 'echo [debug] ' || '' }}gh api -X DELETE /repos/dvsa/$repository/git/refs/heads/${{ inputs.branch-name }} ${{ inputs.dry-run != 'true' && '1>/dev/null' || '' }} && \
            echo "| $repository | ${{ inputs.branch-name }} | ✅ Deleted |" >> $GITHUB_STEP_SUMMARY || \
            echo "| $repository | ${{ inputs.branch-name }} | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          elif [[ $branch_exists -eq 0 && "${{ inputs.action }}" == "Create" ]]; then
            # Determine the default branch (check for 'main' first, then fallback to 'develop')
            default_branch=${{ inputs.branch-source }}
            
            if [[ "${{ inputs.branch-source }}" == "develop" ]]; then
              default_branch=$(gh api -H "Accept: application/vnd.github+json" /repos/dvsa/$repository | jq -r '.default_branch')
            fi
            
            # Check if 'main' exists, and if so, select it
            main_branch_exists=$(git ls-remote --heads https://github.com/dvsa/$repository main | wc -l)
            if [[ $main_branch_exists -gt 0 ]]; then
              default_branch="main"
            fi

            # Retrieve the commit ID of the selected branch
            commit_id=$(gh api -H "Accept: application/vnd.github+json" /repos/dvsa/$repository/branches/${default_branch} | jq -r '.commit.sha')

            # Perform Create action (Dry-run or real)
            ${{ inputs.dry-run == 'true' && 'echo [debug] ' || '' }}gh api -X POST /repos/dvsa/$repository/git/refs -f ref="refs/heads/${{ inputs.branch-name }}" -f sha="$commit_id" ${{ inputs.dry-run != 'true' && '1>/dev/null' || '' }} && \
            echo "| $repository | ${{ inputs.branch-name }} | ✅ Created |" >> $GITHUB_STEP_SUMMARY || \
            echo "| $repository | ${{ inputs.branch-name }} | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| $repository | ${{ inputs.branch-name }} | ⚠️ No Action (Already ${branch_exists -gt 0 && 'Exists' || 'Does Not Exist'}) |" >> $GITHUB_STEP_SUMMARY
          fi
        }

        # Loop Through Repositories
        for repository in $(jq -r '.[]' <<< '${{ inputs.repositories }}'); do
          manage_branch "$repository" &
        done
        wait
