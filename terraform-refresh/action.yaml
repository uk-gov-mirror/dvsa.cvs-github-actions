name: Terraform refresh
description: Refresh the Terraform State

inputs:
  environment-name:
    description: Environment Identifier (e.g. `cb2-1099`)
    required: true
  terraform-version:
    description: The version of Terraform to use (defaults to 1.7.3)
    default: 1.7.3
  create-workspace:
    description: Create new Workspace if required
    default: 'true'
  repository:
    description: The name of the repository
    default: 'cvs-tf'
    
runs:
  using: composite
  steps:
    - name: Initialize Terraform
      uses: dvsa/cvs-github-actions/terraform-initialize@develop
      with:
        terraform-version: ${{ inputs.terraform-version }}
        environment-name: ${{ inputs.environment-name }}
        create-workspace: ${{ inputs.create-workspace }}

    - name: Refresh Terraform
      id: refresh
      continue-on-error: true
      shell: bash
      env:
        AWS_PROFILE: main
      run: terraform refresh

    - name: 🔓 Unlock State File
      if: ${{ steps.refresh.outcome == 'failure' }}
      uses: dvsa/cvs-github-actions/terraform-state-unlock@feature/CB2-16609
      with:
        repository: ${{ inputs.repository}}
        environment-name: ${{ inputs.environment-name }}