name: "GitHub Failure Notifier"
description: "Notifies Teams and/or email when a GitHub job fails."
inputs:
  teams-webhook:
    description: "Microsoft Teams webhook URL"
    required: false
  notify-email:
    description: "Send an email notification"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Get Commit Author Email
      shell: bash
      id: get-email
      run: |
        COMMIT_EMAIL="${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        ALT_EMAIL="${{ github.actor }}@users.noreply.github.com"
        echo "commit-email=$COMMIT_EMAIL" >> $GITHUB_ENV
        echo "alt-email=$ALT_EMAIL" >> $GITHUB_ENV
      

    - name: Send Teams Notification
      shell: bash
      if: ${{ inputs.teams-webhook }}
      env:
        WORKFLOW: ${{ github.workflow }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        ACTOR: ${{ github.actor }}
      run: |
        curl -X POST -H "Content-Type: application/json" \
        -d "{
          \"type\": \"message\",
          \"attachments\": [
            {
              \"contentType\": \"application/vnd.microsoft.card.adaptive\",
              \"content\": {
                \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                \"type\": \"AdaptiveCard\",
                \"version\": \"1.4\",
                \"body\": [
                  {
                    \"type\": \"TextBlock\",
                    \"size\": \"Large\",
                    \"weight\": \"Bolder\",
                    \"text\": \"🚨 GitHub Action Failed!\"
                  },
                  {
                    \"type\": \"TextBlock\",
                    \"text\": \"**Workflow:** $WORKFLOW\"
                  },
                  {
                    \"type\": \"TextBlock\",
                    \"text\": \"**Repository:** [$REPO](https://github.com/$REPO)\"
                  },
                  {
                    \"type\": \"TextBlock\",
                    \"text\": \"**Branch:** $BRANCH\"
                  },
                  {
                    \"type\": \"TextBlock\",
                    \"text\": \"**Commit:** [$COMMIT](https://github.com/$REPO/commit/$COMMIT)\"
                  },
                  {
                    \"type\": \"TextBlock\",
                    \"text\": \"**Run ID:** [View Logs](https://github.com/$REPO/actions/runs/$RUN_ID)\"
                  }
                ]
              }
            }
          ]
        }" "${{ inputs.teams-webhook }}"


    - name: Send Email Notification
      shell: bash
      if: ${{ inputs.notify-email == 'true' }}
      run: |
        echo "GitHub Job Failed for ${{ github.repository }}" | mail -s "🚨 GitHub Job Failed" "$commit-email"