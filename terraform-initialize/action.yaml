name: Terraform Initialize
description: Initialize Terraform

inputs:
  environment-name:
    description: Environment Identifier (e.g. `cb2-1099`)
    required: true
  terraform-version:
    description: The version of Terraform to use (defaults to 1.7.3)
    default: 1.7.3
  folder-name:
    description: Optional folder name, if not in repository
    default: '.'
  state-account:
    description: Account Name for Core TF Standard
    required: false
  create-workspace:
    description: Create new Workspace if required
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure Terraform
      id: terraform_config
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Initialize Terraform
      id: terraform_init
      shell: bash
      run: |
        # Initialize ${{ inputs.environment-name }}
        if [[ ! -f ".terraform/environment" ]]; then
          cd ${{ inputs.folder-name }}
          terraform init -upgrade -reconfigure ${{ inputs.state-account != '' && format('-backend-config="workspace_key_prefix={0}"', inputs.state-account) || '' }}

          terraform workspace select ${{ inputs.create-workspace == 'true' && '-or-create' || '' }} ${{ inputs.environment-name }} \
          && $(echo "Workspace: ${{ inputs.environment-name }}" >> $GITHUB_STEP_SUMMARY)
        fi  
