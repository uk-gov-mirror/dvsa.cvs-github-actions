name: Terraform refresh
description: Refresh the Terraform State

inputs:
  environment-name:
    description: Environment Identifier (e.g. `cb2-1099`)
    required: true
  terraform-version:
    description: The version of Terraform to use (defaults to 1.7.3)
    default: 1.7.3
  create-workspace:
    description: Create new Workspace if required
    default: 'true'
  folder-name:
    description: Optional folder name, if not in repository
    default: '.'
  backend:
    description: Use a custom Backend Configuration
    default: 'false'
  working-directory:
    description: If the Terraform is not in the root of the folder, provide the working working directory
    required: false
  repository:
    description: The name of the repository
    default: 'cvs-tf'
    
runs:
  using: composite
  steps:
    - name: Initialize Terraform
      uses: dvsa/cvs-github-actions/terraform-initialize@develop
      with:
        folder-name: ${{ inputs.folder-name }}
        terraform-version: ${{ inputs.terraform-version }}
        environment-name: ${{ inputs.environment-name }}
        create-workspace: ${{ inputs.create-workspace }}
        working-directory: ${{ inputs.working-directory }}
        backend: ${{ inputs.backend }}

    - name: Refresh Terraform
      id: refresh
      continue-on-error: true
      shell: bash
      env:
        AWS_PROFILE: main
      run: |
        # Refresh Terraform
        ${{ inputs.working-directory != '' && format('cd {0}', inputs.working-directory) || '' }}
        terraform refresh ${{ inputs.state-account != '' && ' -var-file=environments/$(terraform workspace show).tfvars' || '' }}
