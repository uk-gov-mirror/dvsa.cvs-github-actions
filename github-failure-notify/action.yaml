name: "GitHub Failure Notifier"
description: "Notifies Teams and/or email when a GitHub job fails."
inputs:
  teams-webhook:
    description: "Microsoft Teams webhook URL"
    required: false

runs:
  using: "composite"
  steps:      
    - name: Send Teams Notification
      shell: bash
      if: ${{ inputs.teams-webhook }}
      run: |
        curl -X POST -H "Content-Type: application/json" -d '{
          "repo": "'"${{ github.repository }}"'",
          "branch": "'"${{ github.ref_name }}"'",
          "job": "'"${{ github.job }}"'",
          "actor": "'"${{ github.actor }}"'"
        }' "$TEAMS_WEBHOOK"