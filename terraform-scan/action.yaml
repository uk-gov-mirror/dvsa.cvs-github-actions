name: Terraform Scan
description: Perform a Terraform Scan

inputs:
  environment-name:
    description: Environment Identifier (e.g. `cb2-1099`)
    required: true
  terraform-version:
    description: The version of Terraform to use (defaults to 1.7.3)
    default: 1.7.3
  create-workspace:
    description: Should a new Terraform Workspace be created
    default: 'false'
  state-account:
    description: Account Name for Core TF Standard
    required: false
  folder-name:
    description: Optional folder name, if not in repository
    default: '.'

outputs:
  init-outcome:
    description: Outcome of terraform init
    value: ${{ steps.init.outcome }}
  fmt-outcome:
    description: "Outcome of terraform format"
    value: ${{ steps.fmt.outcome }}
  checkov-outcome:
    description: "Outcome of checkov scan"
    value: ${{ steps.checkov.outcome }}

runs:
  using: composite
  steps:

    - name: Initialize Terraform
      id: init
      uses: dvsa/cvs-github-actions/terraform-initialize@develop
      with:
        folder-name: ${{ inputs.folder-name }}
        terraform-version: ${{ inputs.terraform-version }}
        environment-name: ${{ inputs.environment-name }}
        create-workspace: ${{ inputs.create-workspace }}
        state-account: ${{ inputs.state-account }}
    
    - name: Terraform format
      id: fmt
      continue-on-error: true
      shell: bash
      run: |
        # Format Terraform
        cd ${{ inputs.folder-name }}
        terraform fmt -check=true -diff=true > fmt.txt

    - name: Checkov Scan
      id: checkov
      continue-on-error: true
      shell: bash
      run: |
        # Run Checkov Scan
        checkov -d . --skip-framework github_actions -o github_failed_only  --output-file-path checkov-report-${{ github.run_id }}.md

    - name: 📝 Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: checkov-report-${{ github.run_id }}
        path: checkov-report-${{ github.run_id }}.md
        retention-days: 5