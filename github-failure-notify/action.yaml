name: "GitHub Failure Notifier"
description: "Notifies Teams and/or email when a GitHub job fails."
inputs:
  teams-webhook:
    description: "Microsoft Teams webhook URL"
    required: false
  notify-email:
    description: "Send an email notification"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Get Commit Author Email
      shell: bash
      id: get-email
      run: |
        COMMIT_EMAIL="${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        ALT_EMAIL="${{ github.actor }}@users.noreply.github.com"
        echo "commit-email=$COMMIT_EMAIL" >> $GITHUB_ENV
        echo "alt-email=$ALT_EMAIL" >> $GITHUB_ENV

    - name: Debug
      shell: bash
      run: |
        echo "Repo: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Failed Job: ${{ github.job }}"
        echo "Actor: ${{ github.actor }}"
      
    - name: Send Failure Notification to Teams
      if: failure()
      run: |
        curl -X POST -H "Content-Type: application/json" -d '{
          "repo": "'"${GITHUB_REPOSITORY}"'",
          "branch": "'"${GITHUB_REF#refs/heads/}"'",
          "job": "'"${{ github.job }}"'",
          "actor": "'"${GITHUB_ACTOR}"'"
        }' "$TEAMS_WEBHOOK"

    # - name: Debug JSON Payload
